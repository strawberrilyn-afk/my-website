<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Me</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
    }

    * {
      box-sizing: border-box;
    }

    nav {
      background-color: #333;
      padding: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      border-radius: 5px;
      background-color: #f2f2f2;
      padding: 20px;
      max-width: 800px;
      margin: 20px auto;
    }

    input[type=text],
    input[type=email],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: 6px;
      margin-bottom: 16px;
      resize: vertical;
    }

    button[type=submit] {
      background-color: #04AA6D;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button[type=submit]:hover {
      background-color: #45a049;
    }

    .map {
      margin-top: 30px;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: 0;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding: 15px;
      background-color: #333;
      color: white;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="favorites.html">Favorites</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <div class="container">
      <h1>Contact Me</h1>
      <p>Have a question? Send me a message!</p>

      <form id="contactForm">

        <label for="fname">First Name</label>
        <input type="text" id="fname"
               name="firstname"
               placeholder="Your first name..."
               required>

        <label for="lname">Last Name</label>
        <input type="text" id="lname"
               name="lastname"
               placeholder="Your last name..."
               required>

        <label for="email">Email Address</label>
        <input type="email" id="email"
               name="email"
               placeholder="Your email..."
               required>

        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="question">Question</option>
          <option value="feedback">Feedback</option>
          <option value="other">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message"
                  name="message"
                  placeholder="Write your message..."
                  style="height:200px"
                  required></textarea>

        <button type="submit">Submit</button>

      </form>

      <section class="map">
        <h2>Find My City</h2>
        <p>Here's a map of San Diego, California.</p>

        <iframe
          title="Map of San Diego"
          src="https://www.google.com/maps?q=San+Diego+California&output=embed"
          loading="lazy">
        </iframe>
      </section>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 My Autobiographical Website</p>
  </footer>

  <script>
    document.getElementById("contactForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        alert("Thank you! This is a demonstration form. No message was sent.");

        document.getElementById("contactForm").reset();

      });
  </script>

</body>
</html>
